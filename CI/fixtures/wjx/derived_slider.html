<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <title>派生用例-滑块与高校题</title>
</head>

<body>
    <div id="divQuestion">
        <fieldset class="fieldset" pg="1" style="" id="fieldset1">

            <div class="field ui-field-contain" topic="1" id="div1" req="1" data-role="fieldcontain" type="8">
                <div class="field-label"><span class="req">*</span>
                    <div class="topicnumber">1.</div>
                    <div class="topichtml">请拖动滑块为本次服务打分<span class="qtypetip">【滑块题】</span></div>
                </div>
                <div class="ui-slider">
                    <input type="range" id="q1" name="q1" class="ui-slider-input" min="0" max="10" step="1" value="5">
                    <div class="ruler"><span class="cm" data-value="0">0</span><span class="cm"
                            data-value="5">5</span><span class="cm" data-value="10">10</span></div>
                </div>
                <div class="errorMessage"></div>
            </div>

            <div class="field ui-field-contain" topic="2" id="div2" req="1" data-role="fieldcontain" type="6">
                <div class="field-label"><span class="req">*</span>
                    <div class="topicnumber">2.</div>
                    <div class="topichtml">请为下列指标分别打分<span class="qtypetip">【矩阵滑块题】</span></div>
                </div>
                <div class="matrix-slider">
                    <table id="divRefTab2">
                        <tr class="rowtitletr">
                            <td class="title"><span class="itemTitleSpan">响应速度</span></td>
                            <td>
                                <div class="rangeslider"><input type="text" class="ui-slider-input" rowid="1" id="q2_1"
                                        min="1" max="5" step="0.5"></div>
                            </td>
                        </tr>
                        <tr class="rowtitletr">
                            <td class="title"><span class="itemTitleSpan">服务态度</span></td>
                            <td>
                                <div class="rangeslider"><input type="text" class="ui-slider-input" rowid="2" id="q2_2"
                                        min="1" max="5" step="0.5"></div>
                            </td>
                        </tr>
                        <tr class="rowtitletr">
                            <td class="title"><span class="itemTitleSpan">专业程度</span></td>
                            <td>
                                <div class="rangeslider"><input type="text" class="ui-slider-input" rowid="3" id="q2_3"
                                        min="1" max="5" step="0.5"></div>
                            </td>
                        </tr>
                    </table>
                    <div class="ruler"><span class="cm" data-value="1">1</span><span class="cm"
                            data-value="2">2</span><span class="cm" data-value="3">3</span><span class="cm"
                            data-value="4">4</span><span class="cm" data-value="5">5</span></div>
                </div>
                <div class="errorMessage"></div>
            </div>

            <div class="field ui-field-contain" topic="3" id="div3" req="1" data-role="fieldcontain" type="1">
                <div class="field-label"><span class="req">*</span>
                    <div class="topicnumber">3.</div>
                    <div class="topichtml">请输入你就读的高校<span class="qtypetip">【高校题】</span></div>
                </div>
                <div class="ui-controlgroup">
                    <div class="ui-input"><input type="text" id="q3" name="q3" verify="高校" autocomplete="off"
                            placeholder="请输入学校名称"></div>
                </div>
                <div class="errorMessage"></div>
            </div>

            <div class="field ui-field-contain" topic="4" id="div4" data-role="fieldcontain" type="3">
                <div class="field-label">
                    <div class="topicnumber">4.</div>
                    <div class="topichtml">请选择你常驻的城市及区县<span class="qtypetip">【单选题】</span></div>
                </div>
                <div class="ui-controlgroup column1">
                    <div class="ui-radio"><span class="jqradiowrapper"><input type="radio" value="1" id="q4_1"
                                name="q4"><a class="jqradio" href="javascript:;"></a></span>
                        <div class="label" for="q4_1">北京</div><select id="selq4_1">
                            <option value="0">请选择</option>
                            <option value="1">朝阳区</option>
                            <option value="2">海淀区</option>
                        </select>
                    </div>
                    <div class="ui-radio"><span class="jqradiowrapper"><input type="radio" value="2" id="q4_2"
                                name="q4"><a class="jqradio" href="javascript:;"></a></span>
                        <div class="label" for="q4_2">上海</div><select id="selq4_2">
                            <option value="0">请选择</option>
                            <option value="1">浦东新区</option>
                        </select>
                    </div>
                </div>
                <div class="errorMessage"></div>
            </div>

            <div class="field ui-field-contain" topic="5" id="div5" relation="-1" style="display:none;"
                data-role="fieldcontain" type="1">
                <div class="field-label">
                    <div class="topicnumber">5.</div>
                    <div class="topichtml">这是一段不会出现的说明文字</div>
                </div>
                <div class="ui-controlgroup column1">
                    <div class="ui-radio"><input type="radio" value="1" id="q5_1" name="q5">
                        <div class="label" for="q5_1">占位</div>
                    </div>
                </div>
            </div>

        </fieldset>
    </div>
</body>

</html>
